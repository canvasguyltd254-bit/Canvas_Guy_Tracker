<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--ink:#17181a;--muted:#6b7280;--line:#e6e4df;--bg:#f6f5f2;--card:#fff;--coral:#E8512A;--coral-bg:#fff1ec;--green:#16794a;--green-bg:#eaf7ef;--amber:#a8610a;--amber-bg:#fff6e5;--red:#b42318;--red-bg:#fef0ee;--blue:#1d4ed8;--blue-bg:#eef3ff;--grey-bg:#f0efec;--radius:12px}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}

.proto{background:var(--amber-bg);color:var(--amber);border:1px solid #f1d49b;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
.spacer{flex:1}
select.role{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 80px}
.tabs{display:flex;gap:4px;margin:6px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--coral);border-color:var(--coral)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}.kpi span{color:var(--muted);font-size:11.5px;display:block}.kpi strong{font-size:22px}
.kpi.warn strong{color:var(--red)}

.st.gate{border-style:dashed;background:#fffdf7}.st.blocked{border-color:#f3b5ad;background:var(--red-bg)}

.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gantt{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
.g-grid{display:grid;min-width:980px}
.g-h,.g-c{border-bottom:1px solid var(--line);border-right:1px solid #f0efec;padding:6px;font-size:11.5px;min-height:34px}
.g-h{background:#faf9f7;font-weight:700;text-align:center;position:sticky;top:0}
.g-h.off,.g-c.off{background:repeating-linear-gradient(135deg,#f3f2ef,#f3f2ef 6px,#ecebe7 6px,#ecebe7 12px)}

.bar-s.prep{background:#64748b}.bar-s.asm{background:#E8512A}.bar-s.san{background:#c47a1d}.bar-s.fin{background:#7c5cbf}.bar-s.qc{background:#111}.bar-s.pkg{background:#16794a}
.bar-s.blocked{background:var(--red);outline:2px solid #f3b5ad}.bar-s.unas{background:#fff;color:var(--red);border:1.5px dashed var(--red)}
.due{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--ink);z-index:1}
.cust{position:absolute;top:0;bottom:0;width:0;border-left:2px dotted var(--coral);z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin:8px 0}

label.f{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase}
.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}.radio.on{border-color:var(--coral);background:var(--coral-bg)}

ul.clean{margin:6px 0 0 18px;padding:0}
</style>

<body>
<div class="top">
  <div class="brand"><span class="mark">CG</span><div><strong>Workshop production</strong><small>Prototype v2 — corrected workflow</small></div></div>
  <span class="proto">Prototype · nothing is saved · today is Mon 5 Oct 2026</span>
  <div class="spacer"></div>
  <label class="muted">Viewing as
    <select class="role" id="role"><option value="production_manager">Production manager</option><option value="production_staff">Production staff</option><option value="admin">Admin</option></select>

<script>
/* ============================================================
   DATA — in the real build all of this comes from the database.
   Operation lists are fetched from production_operations by stage_key,
   never hard-coded in the component.
   ============================================================ */
const TODAY = 0;                       // day index 0 = Mon 5 Oct 2026
const DAYS = 14;                       // 5 Oct → 18 Oct
const CAP_H_PER_DAY = 8;               // ASSUMPTION to confirm: 8 h/day, Mon–Sat
const QC_THRESHOLD_DAYS = 3;           // configurable setting
const MON = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const dateOf = i => { const d = new Date(Date.UTC(2026,9,5+i)); return d; };
const isOff = i => (i % 7) === 6;      // Sundays
const lbl = i => { const d = dateOf(i); return MON[i%7]+' '+d.getUTCDate()+' Oct'; };
const short = i => dateOf(i).getUTCDate()+' Oct';
const iso = i => dateOf(i).toISOString().slice(0,10);
const idxOf = s => Math.round((Date.parse(s+'T00:00:00Z') - Date.UTC(2026,9,5)) / 86400000);
const addWork = (i,n) => { const s = n<0?-1:1; let c=Math.abs(n); while(c>0){ i+=s; if(!isOff(i)) c--; } return i; };

const STAGES = [
  {k:'prep', name:'Material prep'}, {k:'asm', name:'Assembly'}, {k:'san', name:'Sanding'},
  {k:'fin', name:'Finishing'}, {k:'qc', name:'QC gate', gate:true}, {k:'pkg', name:'Packaging'}
];
const OPERATIONS = {   // production_operations.stage_key → name
  prep:['Material picking','Cut-list preparation','CNC cutting'],
  asm:['Fabrication','Joinery','Assembly','Glass fitting','Upholstery'],
  san:['Sanding','Surface inspection'],
  fin:['One coat','PU','NC','Custom finish'],
  pkg:['Wrapping','Corner protection','Boxing']
  // qc: none — a mandatory manager-only gate, workers are never assigned to it
};
const WORKERS = [
  {id:'ko',name:'Kevin Opare',skills:['Joinery','Assembly'],ini:'KO'},
  {id:'go',name:'Gibson Omufira',skills:['Joinery','Cutting'],ini:'GO'},
  {id:'mo',name:'Mary Otieno',skills:['Glass fitting','Finishing'],ini:'MO'},
  {id:'pk',name:'Peter Kamau',skills:['CNC','Fabrication'],ini:'PK'},
  {id:'jm',name:'Joseph Mwangi',skills:['Sanding'],ini:'JM'},
  {id:'dm',name:'Daniel Mutua',skills:['Sanding','Finishing'],ini:'DM'},
  {id:'gn',name:'Grace Njeri',skills:['Packaging'],ini:'GN'}
];
// qty fields are completed quantities per stage (QC: accepted / rework)
const jobs = [
 {id:'J7', order:'ORD-099', client:'Caviar Interiors', product:'Wall Decoration', spec:'1200 × 1000mm · Pine · Custom colour', num:'JOB-2026-0007', qty:6, due:7, cust:9, mat:[18,20], drw:'2 drawings · Rev B approved',
   done:{prep:6,asm:4,san:1,fin:0,pkg:0}, qc:{accepted:0,rework:0,since:null},
   sch:{prep:[0,0],asm:[0,3],san:[3,4],fin:[4,5],qc:[5,5],pkg:[7,7]}},
 {id:'J8', order:'ORD-099', client:'Caviar Interiors', product:'Circular Mirror', spec:'80cm · Glass · Black frame', num:'JOB-2026-0008', qty:6, due:7, cust:9, mat:[20,20], drw:'1 drawing · Rev A approved',
   done:{prep:6,asm:3,san:0,fin:0,pkg:0}, qc:{accepted:0,rework:0,since:null},
   sch:{prep:[0,0],asm:[1,4],san:[4,5],fin:[5,7],qc:[8,8],pkg:[8,9]}},
 {id:'J11', order:'ORD-104', client:'Nova Spaces', product:'Console Table', spec:'1400 × 400mm · Oak', num:'JOB-2026-0011', qty:2, due:2, cust:4, mat:[8,12], drw:'1 drawing · Rev C',
   done:{prep:0,asm:0,san:0,fin:0,pkg:0}, qc:{accepted:0,rework:0,since:null},
   sch:{prep:[0,2],asm:[2,3],san:[3,4],fin:[4,5],qc:[5,5],pkg:[7,7]}},
 {id:'J12', order:'ORD-104', client:'Nova Spaces', product:'Side Shelf', spec:'900mm · Oak', num:'JOB-2026-0012', qty:4, due:7, cust:9, mat:[10,10], drw:'1 drawing · Rev A',
   done:{prep:4,asm:2,san:0,fin:0,pkg:0}, qc:{accepted:0,rework:0,since:null},
   sch:{prep:[0,0],asm:[0,3],san:[3,4],fin:[4,5],qc:[5,5],pkg:[7,7]}},
 {id:'J13', order:'ORD-075', client:'Lily', product:'Minimal Mirrors', spec:'60cm · Brass', num:'JOB-2026-0013', qty:10, due:10, cust:12, mat:[14,14], drw:'1 drawing · Rev A',
   done:{prep:10,asm:10,san:6,fin:0,pkg:0}, qc:{accepted:0,rework:0,since:null},
   sch:{prep:[0,0],asm:[0,0],san:[0,3],fin:[3,5],qc:[5,5],pkg:[8,9]}},
 {id:'J14', order:'ORD-072', client:'Kimemia Ltd', product:'Reception Frame', spec:'Black PU', num:'JOB-2026-0014', qty:3, due:7, cust:10, mat:[6,6], drw:'1 drawing · Rev B',
   done:{prep:3,asm:3,san:1,fin:0,pkg:0}, qc:{accepted:0,rework:0,since:null},
   sch:{prep:[0,0],asm:[0,0],san:[0,1],fin:[1,4],qc:[4,4],pkg:[5,5]}},
 {id:'J16', order:'ORD-108', client:'Mango Offices', product:'Canvas Set', spec:'Set of 4 · Stretched', num:'JOB-2026-0016', qty:8, due:0, cust:2, mat:[9,9], drw:'No drawing required',
   done:{prep:8,asm:8,san:8,fin:8,pkg:5}, qc:{accepted:8,rework:0,since:null},
   sch:{prep:[0,0],asm:[0,0],san:[0,0],fin:[0,0],qc:[0,0],pkg:[0,2]}},
 {id:'J17', order:'ORD-110', client:'Orchid Co', product:'Framed Prints', spec:'A2 · White oak', num:'JOB-2026-0017', qty:5, due:9, cust:11, mat:[7,7], drw:'1 drawing · Rev A',
   done:{prep:5,asm:5,san:5,fin:5,pkg:0}, qc:{accepted:2,rework:1,since:-3},
   sch:{prep:[0,0],asm:[0,0],san:[0,0],fin:[0,1],qc:[1,1],pkg:[2,3]}}
];
const CHARGES_EXCLUDED = 2;   // delivery + packaging fee lines never become jobs
let assigns = [
 {id:1,job:'J7',stage:'asm',op:'Joinery',emp:'ko',qty:6,mode:'working_together',s:0,e:3,hpd:6},
 {id:2,job:'J7',stage:'asm',op:'Joinery',emp:'go',qty:6,mode:'working_together',s:0,e:3,hpd:4},
 {id:3,job:'J8',stage:'asm',op:'Glass fitting',emp:'mo',qty:6,mode:'working_together',s:1,e:4,hpd:4},
 {id:4,job:'J8',stage:'asm',op:'Assembly',emp:'ko',qty:6,mode:'working_together',s:2,e:4,hpd:6},
 {id:5,job:'J11',stage:'prep',op:'Material picking',emp:'pk',qty:2,mode:'working_together',s:0,e:2,hpd:4},
 {id:6,job:'J12',stage:'asm',op:'Fabrication',emp:'pk',qty:4,mode:'working_together',s:0,e:3,hpd:3},
 {id:7,job:'J13',stage:'san',op:'Sanding',emp:'jm',qty:6,mode:'split_quantity',s:0,e:3,hpd:5},
 {id:8,job:'J13',stage:'san',op:'Sanding',emp:'dm',qty:4,mode:'split_quantity',s:0,e:3,hpd:4},
 {id:9,job:'J16',stage:'pkg',op:'Boxing',emp:'gn',qty:8,mode:'working_together',s:0,e:2,hpd:6},
 {id:10,job:'J17',stage:'fin',op:'PU',emp:'mo',qty:5,mode:'working_together',s:0,e:1,hpd:4}
];
let blockers = [
 {id:1,job:'J11',stage:'prep',reason:'Waiting for drawer hardware',owner:'Jane (purchasing)',expected:2,ref:'PO-0081 · Hardware Hub',notes:'Supplier confirmed dispatch Tue',open:true,log:[]}
];
const MATERIALS = {
 J7:[
  {m:'Frame moulding',u:'m',est:15.2,adj:0,act:14.8,cpu:1200,src:'Timber Mart',by:'Gibson O.',at:'Thu 1 Oct 16:10'},
  {m:'Canvas sheet',u:'sheets',est:6.0,adj:0.3,act:6.5,cpu:1500,src:'Art Supplies Ltd',by:'Gibson O.',at:'Thu 1 Oct 16:12'},
  {m:'Backing board',u:'sheets',est:6.0,adj:0.3,act:null,cpu:2000,src:'In-house stock',by:null,at:null},
  {m:'Hanging sets',u:'pcs',est:6,adj:0,act:null,cpu:90,src:'In-house stock',by:null,at:null}
 ]
};

const S = { tab:'control', sel:'J7', open:new Set(['J7']), q:'', stage:'all', attn:false, role:'production_manager', asg:null, shiftDraft:null };
const can = {
  assign:()=>['production_manager','admin'].includes(S.role),
  schedule:()=>['production_manager','admin'].includes(S.role),
  blocker:()=>['production_manager','admin'].includes(S.role),
  qc:()=>['production_manager','admin'].includes(S.role),
  record:()=>true
};
const W = id => WORKERS.find(w=>w.id===id);
const J = id => jobs.find(j=>j.id===id);
const stageName = k => STAGES.find(s=>s.k===k).name;

/* ============================================================
   DERIVED QUANTITIES (single helper — list, Gantt and detail all use it)
   ============================================================ */
function avail(j){
  const d=j.done, q=j.qc, o={};
  o.prep={done:d.prep, planned:j.qty, available:j.qty-d.prep};          // starts from planned qty
  o.asm ={done:d.asm,  planned:j.qty, available:d.prep-d.asm};
  o.san ={done:d.san,  planned:j.qty, available:d.asm-d.san};
  o.fin ={done:d.fin,  planned:j.qty, available:d.san-d.fin};
  const awaiting = d.fin - q.accepted - q.rework;                      // QC gate
  o.qc  ={done:q.accepted, planned:j.qty, available:awaiting, awaiting, rework:q.rework};
  o.pkg ={done:d.pkg,  planned:j.qty, available:q.accepted-d.pkg};      // from accepted, NOT finishing
  return o;
}
function currentStage(j){
  const a=avail(j);
  if(j.done.pkg>=j.qty) return 'pkg';
  for(const k of ['prep','asm','san','fin']) if(a[k].done<j.qty && a[k].available>0 || (k==='prep'&&a.prep.done<j.qty)) { if(a[k].available>0) return k; }
  if(a.qc.awaiting>0) return 'qc';
  if(a.pkg.available>0) return 'pkg';
  return 'prep';
}
const jobAssigns = (jid,stage) => assigns.filter(a=>a.job===jid && (!stage||a.stage===stage));
function openBlocker(jid){ return blockers.find(b=>b.job===jid && b.open); }

/* ============================================================
   CAPACITY — per-employee, per-day. Warn, never silently block.
   ============================================================ */
function conflicts(){
  const out=[], byEmp={};
  for(const a of assigns) for(let d=a.s; d<=a.e; d++){ if(isOff(d)) continue; ((byEmp[a.emp]??={})[d]??=[]).push(a); }
  for(const emp in byEmp) for(const d in byEmp[emp]){
    const list=byEmp[emp][d], alloc=list.reduce((s,a)=>s+a.hpd,0);
    if(alloc>CAP_H_PER_DAY) out.push({emp,date:+d,jobs:[...new Set(list.map(a=>a.job))],alloc,cap:CAP_H_PER_DAY});
  }
  return out;
}
function weekHours(emp){ let h=0; for(const a of assigns) if(a.emp===emp) for(let d=Math.max(a.s,0); d<=Math.min(a.e,5); d++) if(!isOff(d)) h+=a.hpd; return h; }

/* ============================================================
   ATTENTION — one shared helper, explicit reasons not a boolean
   ============================================================ */
function attention(j){
  const r=[], a=avail(j), sch=j.sch;
  const b=openBlocker(j.id);
  if(b) r.push({c:'blocked',t:'Blocked: '+b.reason+' · owner '+b.owner+' · expected '+short(b.expected)});
  const done = j.done.pkg>=j.qty;
  if(!done && j.due<TODAY) r.push({c:'overdue',t:'Production date passed ('+short(j.due)+')'});
  if(j.mat[0]<j.mat[1]) r.push({c:'materials',t:'Materials: '+j.mat[0]+' of '+j.mat[1]+' lines ready'});
  for(const s of STAGES){ if(s.gate) continue;
    const [st]=sch[s.k]; const complete = s.k==='pkg'?j.done.pkg>=j.qty:a[s.k].done>=j.qty;
    if(!complete && st<=TODAY+2 && st>=TODAY && jobAssigns(j.id,s.k).length===0)
      r.push({c:'unassigned',t:stageName(s.k)+' starts '+lbl(st)+' with no workers assigned'}); }
  conflicts().filter(c=>c.jobs.includes(j.id)).forEach(c=>r.push({c:'capacity',t:W(c.emp).name+' over capacity on '+lbl(c.date)+' ('+c.alloc+' h of '+c.cap+' h)'}));
  if(a.qc.awaiting>0 && j.qc.since!=null && (TODAY-j.qc.since)>QC_THRESHOLD_DAYS) r.push({c:'qcwait',t:'QC waiting '+(TODAY-j.qc.since)+' days (limit '+QC_THRESHOLD_DAYS+')'});
  if(j.qc.rework>0) r.push({c:'rework',t:j.qc.rework+' unit(s) in rework'});
  const finish = j.sch.pkg[1];
  if(!done && finish>j.due) r.push({c:'risk',t:'Planned finish '+short(finish)+' is after production due '+short(j.due)});
  return r;
}

function openAssign(jid,stage){
  if(!can.assign()) return toast('Only production managers and admins can assign workers.');
  if(stage==='qc') return toast('QC is a mandatory manager-only gate — workers are not assigned to it.');
  S.asg={job:jid,stage,op:null,mode:'working_together',sel:{},q:'',s:Math.max(J(jid).sch[stage][0],0),e:J(jid).sch[stage][1],hpd:4};
  renderAssign();

function asgValidation(){
  const g=S.asg, j=J(g.job), errs=[], warns=[], ids=Object.keys(g.sel);
  const planned=j.qty;
  if(!g.op) errs.push('Choose an operation.');
  if(!ids.length) errs.push('Select at least one worker.');
  if(g.e<g.s) errs.push('End date is before the start date.');
  if(g.mode==='working_together'){
    ids.forEach(id=>{ if(!(g.sel[id]>0)||g.sel[id]>planned) errs.push(W(id).name+': quantity must be 1–'+planned+'.'); });
    const qs=new Set(ids.map(id=>g.sel[id])); if(qs.size>1) errs.push('Working together: every worker has the same quantity.');
  } else {
    const sum=ids.reduce((s,id)=>s+(+g.sel[id]||0),0);
    if(ids.some(id=>!(g.sel[id]>0))) errs.push('Each selected worker needs a quantity above 0.');
    if(sum>planned) errs.push('Split quantities add up to '+sum+' — more than the '+planned+' planned.');
    else if(sum<planned && ids.length) warns.push('Split covers '+sum+' of '+planned+' — '+(planned-sum)+' still unallocated.');
  }
  // overlap + capacity (warn, never silently block)
  for(const id of ids) for(let d=g.s; d<=g.e; d++){ if(isOff(d)) continue;
    const other=assigns.filter(a=>a.emp===id && d>=a.s && d<=a.e);
    const alloc=other.reduce((s,a)=>s+a.hpd,0)+g.hpd;
    if(other.length && alloc>CAP_H_PER_DAY){ warns.push(W(id).name+' is over capacity on '+lbl(d)+': '+alloc+' h of '+CAP_H_PER_DAY+' h with '+[...new Set(other.map(a=>J(a.job).num))].join(', ')+'.'); break; }
    else if(other.length){ warns.push(W(id).name+' also works on '+[...new Set(other.map(a=>J(a.job).num))].join(', ')+' on '+lbl(d)+'.'); break; }
  }
  const a=avail(j)[g.stage];
  if(a.available<planned && g.stage!=='prep') warns.push('Only '+a.available+' of '+planned+' are available to this stage today. You can still schedule all '+planned+' — actual completion is capped by upstream quantity.');
  return {errs:[...new Set(errs)],warns:[...new Set(warns)]};
}
function renderAssign(){
  const g=S.asg, j=J(g.job), a=avail(j)[g.stage], v=asgValidation();
  const ops=OPERATIONS[g.stage]||[];
  const q=g.q.toLowerCase();
  const ws=WORKERS.filter(w=>!q||(w.name+' '+w.skills.join(' ')).toLowerCase().includes(q));
  let h='<h2>Assign workers · '+stageName(g.stage)+'</h2><div class="sub">'+j.num+' · '+j.product+' · '+j.qty+' planned total · <b>'+(g.stage==='prep'?a.available+' still to prepare':a.available+' currently available')+'</b></div>';
  h+='<div class="steps"><b>1 '+stageName(g.stage)+'</b> › '+(g.op?'<b>':'')+'2 Operation'+(g.op?'</b>':'')+' › 3 People</div>';
  h+='<label class="f">Operation <span style="font-weight:400;text-transform:none">(only operations belonging to '+stageName(g.stage)+', loaded from the database)</span></label><div class="ops">'+ops.map(o=>'<button class="op '+(g.op===o?'on':'')+'" data-act="aop" data-v="'+o+'">'+o+'</button>').join('')+'</div>';
  h+='<label class="f">How will the team share the work?</label>';
  h+='<div class="radio '+(g.mode==='working_together'?'on':'')+'" data-act="amode" data-v="working_together"><input type="radio" '+(g.mode==='working_together'?'checked':'')+'><div><b>Working together on the same quantity</b><small>Every selected worker works on the same assigned quantity.</small></div></div>';
  h+='<div class="radio '+(g.mode==='split_quantity'?'on':'')+'" data-act="amode" data-v="split_quantity"><input type="radio" '+(g.mode==='split_quantity'?'checked':'')+'><div><b>Split the quantity between workers</b><small>Individual quantities must add up to no more than '+j.qty+'.</small></div></div>';
  h+='<label class="f">Search workers by name or skill</label><input class="in" id="aq" value="'+g.q+'" placeholder="e.g. joinery, Mary">';
  for(const w of ws){
    const sel=g.sel[w.id]!=null, hrs=weekHours(w.id), cap=CAP_H_PER_DAY*6, pct=Math.min(100,hrs/cap*100);
    h+='<div class="wk '+(sel?'sel':'')+'"><span class="av">'+w.ini+'</span><div data-act="awk" data-v="'+w.id+'" style="cursor:pointer"><b>'+w.name+'</b><br><small class="muted">'+w.skills.join(' · ')+' · '+hrs+' of '+cap+' h this week</small></div>';
    h+='<div class="meter"><i class="'+(pct>100?'x':pct>80?'w':'')+'" style="width:'+pct+'%"></i></div>';
    h+=sel?'<input class="in" type="number" min="1" data-act="aqty" data-w="'+w.id+'" value="'+g.sel[w.id]+'">':'<button class="btn sm" data-act="awk" data-v="'+w.id+'">Add</button>';
    h+='</div>';
  }
  h+='<div class="row2"><div><label class="f">Start date</label><input class="in" type="date" id="as" value="'+iso(g.s)+'"></div><div><label class="f">End date</label><input class="in" type="date" id="ae" value="'+iso(g.e)+'"></div><div><label class="f">Hours / day each</label><input class="in" type="number" min="1" max="12" id="ah" value="'+g.hpd+'"></div></div>';
  if(v.errs.length) h+='<div class="note r"><b>Cannot save:</b><ul class="clean">'+v.errs.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>';
  if(v.warns.length) h+='<div class="note a"><b>Heads up (does not block saving):</b><ul class="clean">'+v.warns.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>';
  h+='<div class="note b">Saved with: job, stage, operation, employee, assigned quantity, assignment mode, planned start/end, assigned by.</div>';
  h+='<div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn p" data-act="asave" '+(v.errs.length?'disabled':'')+'>Save assignment</button></div>';
  modal(h,true);
  const aq=$('#aq'); if(aq){ aq.addEventListener('input',e=>{ g.q=e.target.value; const p=e.target.selectionStart; renderAssign(); const n=$('#aq'); n.focus(); n.setSelectionRange(p,p); }); }
  ['as','ae','ah'].forEach(id=>{ const el=$('#'+id); if(el) el.addEventListener('change',e=>{ if(id==='as') g.s=idxOf(e.target.value); if(id==='ae') g.e=idxOf(e.target.value); if(id==='ah') g.hpd=+e.target.value||1; renderAssign(); }); });
  document.querySelectorAll('[data-act=aqty]').forEach(el=>el.addEventListener('change',e=>{ g.sel[el.dataset.w]=+e.target.value; renderAssign(); }));
}
function saveAssign(){
  const g=S.asg, v=asgValidation(); if(v.errs.length) return;
  for(const id of Object.keys(g.sel)) assigns.push({id:Date.now()+Math.random(),job:g.job,stage:g.stage,op:g.op,emp:id,qty:+g.sel[id],mode:g.mode,s:g.s,e:g.e,hpd:g.hpd});
  closeModal(); toast('Assignment saved — '+Object.keys(g.sel).length+' worker(s), '+(g.mode==='working_together'?'working together':'split quantity')+'. Planned dates only; no progress recorded.'); render();
}

// ---- Dates + impact ----------------------------------------------------
function openDates(jid){
  if(!can.schedule()) return toast('Only production managers and admins can change dates.');
  const j=J(jid); S.shiftDraft={job:jid,s:{},e:{}}; STAGES.forEach(s=>{S.shiftDraft.s[s.k]=j.sch[s.k][0];S.shiftDraft.e[s.k]=j.sch[s.k][1];});
  renderDates();
}
function renderDates(){
  const d=S.shiftDraft, j=J(d.job);
  let h='<h2>Stage dates · '+j.product+'</h2><div class="sub">Production due <b>'+lbl(j.due)+'</b> · Customer delivery <b>'+lbl(j.cust)+'</b> (not moved by stage dates). Changing a date never records progress.</div><table><tr><th>Stage</th><th>Start</th><th>End</th></tr>';
  for(const s of STAGES) h+='<tr><td><b>'+s.name+'</b></td><td><input class="in" type="date" data-act="ds" data-k="'+s.k+'" value="'+iso(d.s[s.k])+'"></td><td><input class="in" type="date" data-act="de" data-k="'+s.k+'" value="'+iso(d.e[s.k])+'"></td></tr>';
  h+='</table>';
  const bad=STAGES.filter(s=>isOff(d.s[s.k])||isOff(d.e[s.k]));
  if(bad.length) h+='<div class="note a">'+bad.map(s=>s.name).join(', ')+' start or end on a Sunday (non-working).</div>';
  h+='<div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn p" data-act="dapply">Apply</button></div>';
  modal(h,true);
  document.querySelectorAll('[data-act=ds],[data-act=de]').forEach(el=>el.addEventListener('change',e=>{ const k=el.dataset.k; (el.dataset.act==='ds'?d.s:d.e)[k]=idxOf(e.target.value); renderDates(); }));
}
function applyDates(){
  const d=S.shiftDraft, j=J(d.job);
  const changed=STAGES.filter(s=>d.s[s.k]!==j.sch[s.k][0]||d.e[s.k]!==j.sch[s.k][1]);
  if(!changed.length){ closeModal(); return toast('No date changed.'); }
  const first=changed[0], idx=STAGES.findIndex(s=>s.k===first.k);
  const delta=addDelta(j.sch[first.k][1], d.e[first.k]);
  const later=STAGES.slice(idx+1);
  if(changed.length===1 && delta!==0 && later.length){
    modal('<h2>'+first.name+' moves '+Math.abs(delta)+' working day'+(Math.abs(delta)>1?'s ':' ')+(delta>0?'later':'earlier')+'</h2><div class="sub">Choose how the downstream stages should respond. Dates are never shifted silently.</div>'+
     '<div class="radio" data-act="impact" data-v="shift"><div><b>Shift every later stage</b><small>'+later.map(s=>s.name).join(', ')+' each move '+Math.abs(delta)+' working day(s).</small></div></div>'+
     '<div class="radio" data-act="impact" data-v="keep"><div><b>Keep later dates unchanged</b><small>Creates an overlap and flags the plan for a capacity review.</small></div></div>'+
     '<div class="radio" data-act="impact" data-v="review"><div><b>Review each affected stage</b><small>Return to the stage dates and edit them individually.</small></div></div>'+
     '<div class="note b">Customer delivery stays '+lbl(j.cust)+'. Production due stays '+lbl(j.due)+'.</div><div class="mf"><button class="btn" data-act="close">Cancel</button></div>');
    S.shiftDraft.delta=delta; S.shiftDraft.idx=idx; return;
  }
  commitDates(false);
}
function addDelta(a,b){ let n=0,i=a; const s=b>=a?1:-1; while(i!==b){ i+=s; if(!isOff(i)) n+=s; } return n; }
function commitDates(shiftLater){
  const d=S.shiftDraft, j=J(d.job);
  STAGES.forEach((s,i)=>{ j.sch[s.k]=[d.s[s.k],d.e[s.k]]; });
  if(shiftLater){ STAGES.slice(d.idx+1).forEach(s=>{ const [a,b]=j.sch[s.k]; j.sch[s.k]=[addWork(a,d.delta),addWork(b,d.delta)]; }); }
  // assignments follow their stage's planned dates (still planned only)
  assigns.filter(x=>x.job===j.id).forEach(x=>{ x.s=j.sch[x.stage][0]; x.e=j.sch[x.stage][1]; });
  closeModal(); render();
  const risk=j.sch.pkg[1]>j.due; toast('Dates updated.'+(risk?' ⚠ Planned finish is now after production due.':''));
}
// ---- Blockers -----------------------------------------------------------
function openBlockerForm(jid){
  if(!can.blocker()) return toast('Only production managers and admins manage blockers.');
  const j=J(jid);
  modal('<h2>Raise blocker · '+j.product+'</h2><div class="sub">A blocker needs an owner and an expected resolution. Moving dates alone is not a fix for a material shortage.</div>'+
   '<label class="f">Stage</label><select class="in" id="bs">'+STAGES.filter(s=>!s.gate).map(s=>'<option value="'+s.k+'">'+s.name+'</option>').join('')+'</select>'+
   '<label class="f">Reason</label><input class="in" id="br" placeholder="e.g. Waiting for hinges">'+
   '<div class="row2"><div><label class="f">Responsible person</label><input class="in" id="bo"></div><div><label class="f">Expected resolution</label><input class="in" type="date" id="be" value="'+iso(2)+'"></div><div><label class="f">Supplier / PO ref</label><input class="in" id="bp"></div></div>'+
   '<label class="f">Notes</label><textarea class="in" id="bn" rows="2"></textarea><div id="berr"></div><div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn p" data-act="bsave" data-v="'+jid+'">Raise blocker</button></div>');
}
function saveBlocker(jid){
  const r=$('#br').value.trim(), o=$('#bo').value.trim();
  if(!r||!o){ $('#berr').innerHTML='<div class="note r">Reason and responsible person are required.</div>'; return; }
  blockers.push({id:Date.now(),job:jid,stage:$('#bs').value,reason:r,owner:o,expected:idxOf($('#be').value),ref:$('#bp').value.trim()||'—',notes:$('#bn').value.trim(),open:true,log:['Raised by Production manager · '+lbl(0)]});
  closeModal(); toast('Blocker raised and visible in list, Gantt and job view.'); render();
}
function openResolve(jid){
  if(!can.blocker()) return toast('Only production managers and admins manage blockers.');
  const b=openBlocker(jid);
  modal('<h2>Resolve blocker</h2><div class="sub">'+b.reason+' · owner '+b.owner+' · '+b.ref+'</div><label class="f">Resolution note</label><textarea class="in" id="rn" rows="3" placeholder="What fixed it? e.g. Hardware received and checked"></textarea><div id="rerr"></div><div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn p" data-act="rsave" data-v="'+jid+'">Mark resolved</button></div>');
}
function saveResolve(jid){
  const n=$('#rn').value.trim(); if(!n){ $('#rerr').innerHTML='<div class="note r">A resolution note is required.</div>'; return; }
  const b=openBlocker(jid); b.open=false; b.log.push('Resolved by Production manager · '+lbl(0)+' · '+n);
  modal('<h2>Blocker resolved</h2><div class="sub">Dates were not changed automatically.</div><div class="note a">Review downstream dates now? The delay may have pushed later stages past production due.</div><div class="mf"><button class="btn" data-act="close">Later</button><button class="btn p" data-act="dates" data-v="'+jid+'">Review dates</button></div>');
  render();
}
// ---- Progress (demo of the quantity cap) ----------------------------------
function recordProgress(k){
  const j=J(S.sel), a=avail(j), n=+($('#rc_'+k).value)||0, x=a[k];
  if(n<1) return toast('Enter a quantity of 1 or more.');
  if(n>x.available) return toast('Refused: only '+x.available+' available to '+stageName(k)+' from the previous stage (you entered '+n+').');
  j.done[k]+=n; render(); toast(n+' recorded for '+stageName(k)+'. Availability downstream updated everywhere.');
}
function qcAccept(){
  const j=J(S.sel), a=avail(j), n=+($('#rc_qc').value)||0;
  if(!can.qc()) return toast('QC decisions are manager/admin only.');
  if(n<1||n>a.qc.awaiting) return toast('Refused: '+a.qc.awaiting+' awaiting QC.');
  j.qc.accepted+=n; render(); toast(n+' accepted at QC — they are now available to Packaging.');
}
// ---- Printing -----------------------------------------------------------------
function openPrint(jid){
  S.print={scope:jid?'job':'visible',type:'shop',job:jid||S.sel};
  renderPrint();
}
function printJobs(){
  const p=S.print, j=J(p.job);
  if(p.scope==='job') return [j];
  if(p.scope==='visible') return visibleJobs();
  if(p.scope==='order') return jobs.filter(x=>x.order===j.order);
  return jobs;
}
function renderPrint(){
  const p=S.print, j=J(p.job), n=printJobs().length;
  const sc=[['job','Selected job',j.product+' · '+j.num],['visible','Visible filtered jobs',visibleJobs().length+' jobs currently shown'],['order','Whole order',j.client+' · '+jobs.filter(x=>x.order===j.order).length+' jobs'],['all','All active workshop jobs',jobs.length+' active jobs']];
  let h='<h2>Print packs</h2><div class="sub">1. Choose what to print · 2. Choose the print type</div>';
  h+=sc.map(([k,t,s])=>'<div class="radio '+(p.scope===k?'on':'')+'" data-act="pscope" data-v="'+k+'"><div><b>'+t+'</b><small>'+s+'</small></div></div>').join('');
  h+='<div style="height:6px"></div>'+[['shop','Shop-floor job card','No costs, supplier prices, margins or selling prices'],['internal','Internal production pack','BoQ vs actual, costs, variances, source, who recorded and when'],['short','Shortage sheet (proposed — not in brief)','Missing material lines per job']].map(([k,t,s])=>'<div class="radio '+(p.type===k?'on':'')+'" data-act="ptype" data-v="'+k+'"><div><b>'+t+'</b><small>'+s+'</small></div></div>').join('');
  h+='<div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn p" data-act="ppreview" '+((p.type==='internal'&&!can.assign())?'disabled':'')+'>Open preview ('+n+')</button></div>';
  if(p.type==='internal'&&!can.assign()) h+='<div class="note r">Internal packs are for production managers and admins only.</div>';
  modal(h);
}
function sheetShop(j){
  const rows=STAGES.filter(s=>!s.gate).map(s=>{ const asg=jobAssigns(j.id,s.k); return '<tr><td>'+s.name+(asg[0]?' · '+asg[0].op:'')+'</td><td>'+(asg.length?[...new Set(asg.map(a=>W(a.emp).name))].join(', '):'<i>Unassigned</i>')+'</td><td class="n">'+j.qty+'</td><td>'+short(j.sch[s.k][0])+'–'+short(j.sch[s.k][1])+'</td><td><div class="sign"></div></td></tr>'; }).join('');
  const qc='<tr><td>QC gate (manager)</td><td>Manager</td><td class="n">'+j.qty+'</td><td>'+short(j.sch.qc[0])+'</td><td><div class="sign"></div></td></tr>';
  const m=MATERIALS[j.id];
  return '<div class="sheet"><span class="conf" style="background:var(--green-bg);color:var(--green)">SHOP FLOOR · NO COSTS</span><h4>'+j.num+' · '+j.order+'</h4><div><b>'+j.product+'</b> · '+j.spec+' · Qty '+j.qty+' · Production due '+short(j.due)+'</div>'+
   '<table style="margin-top:8px"><tr><th>Stage / operation</th><th>Team</th><th class="n">Qty</th><th>Dates</th><th>Sign-off</th></tr>'+rows+qc+'</table>'+
   '<div style="margin-top:8px"><b>Materials required</b>: '+(m?m.map(x=>x.m+' '+(x.est+x.adj).toFixed(2)+' '+x.u).join(' · '):'see BoQ')+'</div><div class="muted">Drawings: '+j.drw+'</div><div class="muted" style="margin-top:6px">Notes / shortages: ________________________________</div></div>';
}
function sheetInternal(j){
  const m=MATERIALS[j.id]; if(!m) return '<div class="sheet"><span class="conf">INTERNAL</span><h4>'+j.num+'</h4><div class="muted">No BoQ lines in this prototype for this job.</div></div>';
  let est=0,act=0,rec=0;
  const rows=m.map(x=>{ const fin=x.est+x.adj; const ec=fin*x.cpu; est+=ec; const has=x.act!=null; if(has){ act+=x.act*x.cpu; rec++; }
    return '<tr><td>'+x.m+'</td><td class="n">'+x.est.toFixed(2)+'</td><td class="n">'+(x.adj?'+'+x.adj.toFixed(2):'—')+'</td><td class="n">'+fin.toFixed(2)+'</td><td class="n">'+(has?x.act.toFixed(2):'<i style="color:var(--amber)">Not recorded</i>')+'</td><td class="n">'+(has?((x.act-fin>=0?'+':'')+(x.act-fin).toFixed(2)):'—')+'</td><td class="n">'+Math.round(ec).toLocaleString()+'</td><td class="n">'+(has?Math.round(x.act*x.cpu).toLocaleString():'—')+'</td><td>'+x.src+'</td><td>'+(has?x.by+' · '+x.at:'—')+'</td></tr>'; }).join('');
  return '<div class="sheet"><span class="conf">INTERNAL · CONFIDENTIAL</span><h4>'+j.num+' · '+j.order+'</h4><div><b>'+j.product+'</b> · Qty '+j.qty+'</div>'+
   '<table style="margin-top:8px"><tr><th>Material</th><th class="n">BoQ est.</th><th class="n">Adj.</th><th class="n">Final plan</th><th class="n">Actual</th><th class="n">Var.</th><th class="n">Est. cost</th><th class="n">Actual cost</th><th>Source</th><th>Recorded by / when</th></tr>'+rows+'</table>'+
   '<div style="margin-top:8px"><b>Estimated cost KES '+Math.round(est).toLocaleString()+'</b> · Actual cost recorded for '+rec+' of '+m.length+' lines: <b>KES '+Math.round(act).toLocaleString()+' (partial — not a job total)</b></div>'+
   '<div class="note a" style="margin-top:6px">Unrecorded actuals are shown as “Not recorded”, never as zero, so the total cannot look cheaper than it is. Labour hours are not shown — no hours are captured yet (decision 2).</div><div class="muted">Manager review / variance explanation: ________________________________</div></div>';
}
function sheetShort(j){
  const m=j.mat[1]-j.mat[0]; const b=openBlocker(j.id);
  return '<div class="sheet"><h4>Shortage sheet · '+j.num+'</h4><div>'+j.product+' · '+(m>0?m+' material line(s) not ready':'No shortages')+(b?'<br>Blocker: '+b.reason+' · '+b.ref+' · expected '+short(b.expected):'')+'</div></div>';
}
function previewPrint(){
  const p=S.print, list=printJobs();
  const body=list.map(j=>p.type==='shop'?sheetShop(j):p.type==='internal'?sheetInternal(j):sheetShort(j)).join('');
  modal('<h2>Print preview · '+(p.type==='shop'?'Shop-floor job cards':p.type==='internal'?'Internal production pack':'Shortage sheets')+'</h2><div class="sub">'+list.length+' sheet(s). '+(p.type==='shop'?'No financial figures appear on these.':'Do not issue to customers.')+'</div>'+(body||'<div class="note a">No jobs in scope.</div>')+'<div class="mf"><button class="btn" data-act="close">Close</button><button class="btn p" onclick="toast(\'Prototype: would open the print dialog\')">Print</button></div>',true);
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(el.tagName==='INPUT'&&a==='aqty') return;
  if(a==='ovclose'&&e.target!==el) return;   // only a click on the dark backdrop closes
  switch(a){
    case 'tab': S.tab=v; render(); break;
    case 'toggle': S.open.has(v)?S.open.delete(v):S.open.add(v); render(); break;
    case 'gtoggle': S.open.has('g'+v)?S.open.delete('g'+v):S.open.add('g'+v); render(); break;
    case 'stage': S.stage=v; render(); break;
    case 'attn': S.attn=!S.attn; render(); break;
    case 'reset': S.q='';S.stage='all';S.attn=false; render(); break;
    case 'select': S.sel=v; S.tab='job'; render(); break;
    case 'assign': { const [j,s]=v.split('|'); openAssign(j,s); break; }
    case 'aop': S.asg.op=v; renderAssign(); break;
    case 'amode': S.asg.mode=v; if(v==='working_together'){ const q=Object.values(S.asg.sel)[0]; Object.keys(S.asg.sel).forEach(k=>S.asg.sel[k]=q||J(S.asg.job).qty); } renderAssign(); break;
    case 'awk': { const w=v; if(S.asg.sel[w]!=null) delete S.asg.sel[w]; else S.asg.sel[w]=S.asg.mode==='working_together'?J(S.asg.job).qty:1; renderAssign(); break; }
    case 'asave': saveAssign(); break;
    case 'dates': openDates(v); break;
    case 'dapply': applyDates(); break;
    case 'impact': if(v==='review'){ renderDates(); } else commitDates(v==='shift'); break;
    case 'blocker': openBlockerForm(v); break;
    case 'bsave': saveBlocker(v); break;
    case 'resolve': openResolve(v); break;
    case 'rsave': saveResolve(v); break;
    case 'record': recordProgress(v); break;
    case 'qcaccept': qcAccept(); break;
    case 'print': openPrint(v); break;
    case 'pscope': S.print.scope=v; renderPrint(); break;
    case 'ptype': S.print.type=v; renderPrint(); break;
    case 'ppreview': previewPrint(); break;
    case 'close': case 'ovclose': closeModal(); break;
  }
});
$('#role').addEventListener('change',e=>{ S.role=e.target.value; render(); toast('Viewing as '+e.target.options[e.target.selectedIndex].text+' — controls follow the role rules (enforced server-side in the real build).'); });
render();
</script>
</body>
</html>
